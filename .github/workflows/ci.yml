name: CI/CD

on:
  push:
    branches:
      - Main-stable
  pull_request:
    branches:
      - Main-stable

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 black mypy
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Lint with black
        run: python -m black --check .
      - name: Lint with flake8
        run: python -m flake8 --config=.flake8 docs scripts src tests --max-line-length=88 --extend-ignore=E501,W293,F821,E402,E203,F401,W503 --show-source --statistics
      - name: Type check with mypy
        run: python -m mypy docs scripts src tests --no-site-packages

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Test with pytest
        env:
          TOKEN: "123:dummy"
          CHAT_ID: "123456"
        run: python -m pytest --cov=. --cov-report=xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install safety bandit
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Run safety check
        run: safety check
        continue-on-error: true
      - name: Run bandit
        run: python -m bandit -r src -ll

  notify-failure:
    needs: [lint, test, security]
    if: failure() && github.ref == 'refs/heads/Main-stable'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Create issue on CI failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[Vigía CI] Fallo en CI/CD: Run #${context.runId}`;
            let details = '';
            try {
              const jobsRes = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId
              });
              const failedJobs = jobsRes.data.jobs.filter(j => j.conclusion === 'failure');
              for (const fj of failedJobs) {
                try {
                  const logRes = await github.rest.actions.downloadJobLogsForWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    job_id: fj.id
                  });
                  const lines = String(logRes.data).split('\n');
                  const relevant = lines.filter(l => l.includes('error') || l.includes('FAIL') || l.includes('flake8') || l.includes('bandit') || l.includes('mypy') || l.includes('Error'));
                  details += `\n\n#### Detalle de ${fj.name}:\n\`\`\`text\n` + (relevant.slice(-25).join('\n') || lines.slice(-25).join('\n')) + `\n\`\`\``;
                } catch (eLog) {
                  details += `\n\n(No se pudo descargar log de ${fj.name}: ${eLog.message})`;
                }
              }
            } catch (eJobs) {
              details += `\n\n(No se pudieron listar jobs: ${eJobs.message})`;
            }

            const body = `### 🚨 Fallo de CI/CD detectado por Vigía\n\n` +
              `- **Rama:** \`${context.ref}\`\n` +
              `- **Commit:** [${context.sha.substring(0, 7)}](${context.payload.repository?.html_url || ''}/commit/${context.sha})\n` +
              `- **Workflow Run:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n` +
              `- **Actor:** @${context.actor}\n` +
              details;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure'
            });
            const exists = issues.data.some(i => i.title.includes(`${context.runId}`));
            if (!exists) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['vigia', 'ci-failure', 'bug']
              });
            }

