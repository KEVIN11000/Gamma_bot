name: CI/CD

on:
  push:
    branches:
      - Main-stable
  pull_request:
    branches:
      - Main-stable

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black mypy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint with black
        run: black --check .
      - name: Lint with flake8
        run: flake8 . --max-line-length=88 --extend-ignore=E501,W293,F821,E402,E203,F401
      - name: Type check with mypy
        run: mypy . --no-site-packages

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Test with pytest
        env:
          TOKEN: "123:dummy"
          CHAT_ID: "123456"
        run: pytest --cov=. --cov-report=xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run safety check
        run: safety check
        continue-on-error: true
      - name: Run bandit
        run: bandit -r . -x tests,test_qa_suite.py -ll

  notify-failure:
    needs: [lint, test, security]
    if: failure() && github.ref == 'refs/heads/Main-stable'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issue on CI failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[Vigía CI] Fallo en CI/CD: Run #${context.runId}`;
            const body = `### 🚨 Fallo de CI/CD detectado por Vigía\n\n` +
              `- **Rama:** \`${context.ref}\`\n` +
              `- **Commit:** [${context.sha.substring(0, 7)}](${context.payload.repository?.html_url || ''}/commit/${context.sha})\n` +
              `- **Workflow Run:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n` +
              `- **Actor:** @${context.actor}\n\n` +
              `Revisa los logs del pipeline para resolver el problema.`;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure'
            });
            const exists = issues.data.some(i => i.title.includes(`${context.runId}`));
            if (!exists) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['vigia', 'ci-failure', 'bug']
              });
            }

